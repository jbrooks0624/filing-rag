# 50-question golden set (20 single_hop, 10 temporal, 10 within_sector,
# 5 cross_sector, 5 unanswerable). Citations are (accession, item_code);
# matching is section-level so recall is comparable across chunkers.
questions:
- id: sh-001
  type: single_hop
  query: What cybersecurity incidents does Microsoft disclose in its FY2024 10-K?
  answerable: true
  answer: Microsoft says it has experienced cybersecurity incidents in which actors gained unauthorized
    access to IT systems and data, including customer systems and data.
  citations:
  - accession: 0000950170-24-087843
    item_code: 1A
    quote: we have experienced cybersecurity incidents in which such actors have gained unauthorized access
      to our IT systems and data, including customer systems and data.
- id: sh-002
  type: single_hop
  query: How fast did Microsoft's Azure and other cloud services grow in FY2024?
  answerable: true
  answer: Server products and cloud services revenue increased 22%, driven by Azure and other cloud services
    growth of 30%.
  citations:
  - accession: 0000950170-24-087843
    item_code: '7'
    quote: Server products and cloud services revenue increased 22% driven by Azure and other cloud services
      growth of 30%.
- id: sh-003
  type: single_hop
  query: What foreign-currency risk does Microsoft disclose in FY2024 Item 7A?
  answerable: true
  answer: Certain forecasted transactions, assets, and liabilities are exposed to foreign currency risk.
  citations:
  - accession: 0000950170-24-087843
    item_code: 7A
    quote: Certain forecasted transactions, assets, and liabilities are exposed to foreign currency risk.
- id: sh-004
  type: single_hop
  query: How does Alphabet describe generative AI as a competitive risk in FY2024?
  answerable: true
  answer: Alphabet is integrating generative AI into products and says AI technology and services are
    highly competitive, rapidly evolving, and require significant investment.
  citations:
  - accession: 0001652044-25-000014
    item_code: 1A
    quote: This includes generative AI and continuing to integrate AI capabilities into our products and
      services.
- id: sh-005
  type: single_hop
  query: What operating segments does Alphabet report for Google in FY2024?
  answerable: true
  answer: Google is reported in two segments, Google Services and Google Cloud, with other businesses
    as Other Bets.
  citations:
  - accession: 0001652044-25-000014
    item_code: '7'
    quote: We report Google in two segments, Google Services and Google Cloud; we also report all non-Google
      businesses collectively as Other Bets.
- id: sh-006
  type: single_hop
  query: How does Alphabet hedge foreign-exchange risk on monetary assets in FY2024?
  answerable: true
  answer: It uses foreign currency forward and option contracts to offset FX risk on monetary assets and
    liabilities in non-functional currencies.
  citations:
  - accession: 0001652044-25-000014
    item_code: 7A
    quote: We use foreign currency forward and option contracts to offset the foreign exchange risk on
      monetary assets and liabilities denominated in currencies other than the functional currency of
      the subsidiary.
